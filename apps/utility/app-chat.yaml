# Chat server (federated-chat-app), released from the chat app repo. It was migrated in place from a
# hand-installed Helm release, and its secrets now come from Vault (argocd/utility/chat/secrets).
#
# Deliberately cautious because the namespace holds real data:
#   - no resources-finalizer, so deleting this Application never deletes the
#     Postgres or uploads volumes
#   - automated sync WITHOUT prune: changes in git are applied, but nothing is
#     ever deleted automatically. Remove an old resource by hand.
#   - no selfHeal, so a manual kubectl change is not silently reverted
# Because sync is automatic, a push that changes targetRevision deploys a new
# chart version within minutes: run scripts/chat-backup.sh BEFORE you push it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat
  namespace: argocd
spec:
  destination:
    namespace: chat
    server: https://kubernetes.default.svc
  project: default
  sources:
  - repoURL: ghcr.io/sam-bowman/charts
    chart: federated-chat-app
    targetRevision: 0.18.0
    helm:
      releaseName: chat
      valueFiles:
      - $values/argocd/utility/chat/values.yaml
  - repoURL: https://github.com/sam-bowman/homelab-cluster
    targetRevision: HEAD
    ref: values
  - repoURL: https://github.com/sam-bowman/homelab-cluster
    targetRevision: HEAD
    path: argocd/utility/chat/secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
    - ServerSideApply=true
    - PruneLast=true
  revisionHistoryLimit: 2
