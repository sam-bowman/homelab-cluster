apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-upgrade-controller
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: k3s-upgrade-controller
    server: https://kubernetes.default.svc
  project: default
  sources:
  - repoURL: https://github.com/sam-bowman/homelab-cluster
    path: argocd/base/k3s-upgrade-controller
    targetRevision: HEAD
  # system-upgrade-controller installs and updates its own Plan CRD (the live schema is newer than crd.yaml),
  # so ignore the CRD body instead of fighting it.
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: plans.upgrade.cattle.io
    jsonPointers:
    - /spec
    - /metadata/annotations
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - PruneLast=true
  revisionHistoryLimit: 2