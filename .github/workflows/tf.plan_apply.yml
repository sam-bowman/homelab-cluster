name: 'TF - Plan & Apply'

# Pull requests only plan; pushes to main plan and apply.
on:
  push:
    branches: [ "main" ]
    paths:
    - terraform/**
    - .github/workflows/tf.plan_apply.yml
  pull_request:
    branches: [ "main" ]
    paths:
    - terraform/**
    - .github/workflows/tf.plan_apply.yml
  workflow_dispatch:

# One run at a time, so two pushes never plan against the same state at once. Queued runs are not cancelled.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  OPNSENSE_API_KEY:                     ${{ secrets.OPNSENSE_API_KEY }}
  OPNSENSE_API_SECRET:                  ${{ secrets.OPNSENSE_API_SECRET }}
  OPNSENSE_URI:                         ${{ secrets.OPNSENSE_URI }}
  CLOUDFLARE_API_TOKEN:                 ${{ secrets.CLOUDFLARE_API_KEY }}
  TF_VAR_oracle_fingerprint:            ${{ secrets.ORACLE_TF_VAR_FINGERPRINT }}
  TF_VAR_oracle_ssh_private_key_base64: ${{ secrets.ORACLE_TF_VAR_PRIVATE_KEY_BASE64 }}
  TF_VAR_oracle_ssh_public_key_base64:  ${{ secrets.ORACLE_TF_VAR_PUBLIC_KEY_BASE64 }}
  TF_VAR_oracle_region:                 ${{ secrets.ORACLE_TF_VAR_REGION }}
  TF_VAR_oracle_tenancy_ocid:           ${{ secrets.ORACLE_TF_VAR_TENANCY_OCID }}
  TF_VAR_oracle_user_ocid:              ${{ secrets.ORACLE_TF_VAR_USER_OCID }}

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: [self-hosted, linux, ARM64]
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: terraform
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # The wrapper is what needed Node on the runner; without it there is no Node install step.
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.17.2
        terraform_wrapper: false

    - name: Cache providers
      uses: actions/cache@v6
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}

    - name: Terraform Init
      run: |
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        terraform init -input=false -lockfile=readonly

    - name: Terraform Plan
      run: |
        terraform plan -input=false -lock-timeout=5m -out=tfplan | tee plan.txt
        echo "### Terraform plan" >> "$GITHUB_STEP_SUMMARY"
        grep -E '^(Plan:|No changes\.)' plan.txt | sed 's/\x1b\[[0-9;]*m//g' >> "$GITHUB_STEP_SUMMARY" || true

    - name: Terraform Apply
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: terraform apply -auto-approve -input=false -lock-timeout=5m tfplan
