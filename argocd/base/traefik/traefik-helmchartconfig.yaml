# /var/lib/rancher/k3s/server/manifests/traefik-helmchartconfig.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      enabled: true
      replicas: 3
    ports:
      web:
        # Send plain http to https. The *arr apps build their login redirect as http://.
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
        allowExternalNameServices: true
    log:
      level: DEBUG