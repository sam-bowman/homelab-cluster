apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openproject-ingress-route
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openproject.bowmans.site`)
      kind: Rule
      services:
      - name: openproject
        port: 8080
  tls:
    secretName: openproject-certificate