apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openproject-ingress-route
  annotations:
    gethomepage.dev/href: "https://openproject.bowmans.site/"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: OpenProject
    gethomepage.dev/group: CICD
    gethomepage.dev/icon: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/openproject.png"
    gethomepage.dev/app: openproject
    gethomepage.dev/name: OpenProject
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=openproject"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openproject.bowmans.site`)
      kind: Rule
      services:
      - name: openproject
        port: 8080
  tls:
    secretName: openproject-certificate