# STEP 1 of moving the chat secrets into Vault: read them into a scratch Secret
# (chat-vault-check) so they can be compared with the live ones before anything
# is overwritten. Run scripts/chat-verify-vault-secrets.sh after it syncs.
# Nothing uses chat-vault-check. Delete this file once the real ExternalSecrets are in place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-vault-check
  namespace: chat
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chat-vault-check
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
  - secretKey: jwt-access-secret
    remoteRef:
      key: secret/CHAT
      property: CH_JWTACCESSSECRET
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  - secretKey: jwt-refresh-secret
    remoteRef:
      key: secret/CHAT
      property: CH_JWTREFRESHSECRET
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  - secretKey: postgres-password
    remoteRef:
      key: secret/CHAT
      property: PG_PASSWORD
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  - secretKey: api-secret
    remoteRef:
      key: secret/CHAT
      property: VO_APISECRET
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
