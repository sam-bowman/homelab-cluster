# The chat Secrets, read from Vault (secret/CHAT) into the Secrets the chart already uses.
#
# creationPolicy: Merge adds the Vault values to the existing Secret instead of replacing it,
# and deletionPolicy: Retain keeps the Secret if one of these objects is ever removed.
# The values were checked equal to the live ones (scripts/chat-verify-vault-secrets.sh) before this was switched on.
#
# To rotate a secret: change it in Vault. External Secrets updates the Secret within an hour; restart the
# affected pods to pick it up. Rotating postgres-password also needs ALTER USER inside Postgres, because
# the old password is stored in the database volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-jwt
  namespace: chat
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chat-federated-chat-app-jwt
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
  - secretKey: jwt-access-secret
    remoteRef:
      key: secret/CHAT
      property: CH_JWTACCESSSECRET
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  - secretKey: jwt-refresh-secret
    remoteRef:
      key: secret/CHAT
      property: CH_JWTREFRESHSECRET
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-postgresql
  namespace: chat
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chat-federated-chat-app-postgresql
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
  - secretKey: postgres-password
    remoteRef:
      key: secret/CHAT
      property: PG_PASSWORD
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-livekit
  namespace: chat
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chat-federated-chat-app-livekit
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
  - secretKey: api-secret
    remoteRef:
      key: secret/CHAT
      property: VO_APISECRET
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
