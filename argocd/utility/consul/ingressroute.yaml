apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hashicorp-consul-ingress-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Consul
    gethomepage.dev/description: Vault storage
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/hashicorp-consul.png"
    gethomepage.dev/href: "https://consul.bowmans.site/"
    gethomepage.dev/pod-selector: "app=consul,component=server"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`consul.bowmans.site`)
      kind: Rule
      services:
      - name: hashicorp-consul-consul-server
        port: 8500
  tls:
    secretName: hashicorp-consul-certificate