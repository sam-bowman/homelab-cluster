global:
  enabled: true
  tlsDisable: true
injector:
  enabled: true
csi:
  enabled: true
server:
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    initialDelaySeconds: 60
    # Tolerate about a minute of storage trouble (e.g. the single Consul server restarting) before the pod is
    # restarted. The chart default restarts it after 4 seconds.
    periodSeconds: 10
    failureThreshold: 6
    timeoutSeconds: 5
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 2
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address     = "0.0.0.0:8200"
      }
      storage "consul" {
        path = "vault"
        address = "hashicorp-consul-consul-server.hashicorp-consul:8500"
      }
ui:
  enabled: true
  externalPort: 8200