apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hashicorp-vault-ingress-route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Vault
    gethomepage.dev/description: Secrets
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/hashicorp-vault.png"
    gethomepage.dev/href: "https://vault.bowmans.site/"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=vault"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vault.bowmans.site`)
      kind: Rule
      services:
      - name: hashicorp-vault
        port: 8200
  tls:
    secretName: hashicorp-vault-certificate