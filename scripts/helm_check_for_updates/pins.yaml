# Per-app notes for check_updates.py.
#   pinned: true  -> --apply refuses unless --force (reason is shown)
#   careful: ...  -> only shown in the report and the diff, to remind you what to do first
unifi:
  pinned: true
  reason: >-
    Chart 2.x mounts data at /data (this image keeps it in /unifi/data) and changed the Deployment
    selector (once broke the controller). The mount path and the image tag (now v10.0.162) are set in
    argocd/network/unifi/values/values.yaml. Controller upgrades only migrate forward: take a Longhorn
    backup (scripts/longhorn_backup_all.py --only unifi/unifi-pvc) and a UniFi .unf backup first, and check --diff.
chat:
  pinned: true
  reason: >-
    Released from the chat app repo. Run scripts/chat-backup.sh BEFORE bumping: new versions can
    migrate the database. The script's output (volumes and database dump) is the way back.
hashicorp-vault:
  careful: "pods use OnDelete: delete them one at a time after the sync; vault-unsealer unseals them again"
hashicorp-consul:
  careful: "Vault keeps its data in Consul: take a snapshot first and move one minor version at a time"
longhorn:
  careful: "storage: one minor version at a time, all volumes healthy first, nightly backup to the NAS must be recent"
cert-manager:
  careful: "installs CRDs: read the release notes for removed API versions"
external-secrets:
  careful: "installs CRDs: read the release notes; the chat and homepage secrets depend on it"
github-arc:
  careful: "the runner that applies Terraform runs here; do not update while a workflow is running"
